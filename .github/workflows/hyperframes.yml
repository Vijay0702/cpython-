name: HyperFrames render

on:
  push:
    paths:
      - "hyperframes-demo/**"
      - ".github/workflows/hyperframes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hyperframes-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check composition
        run: npm run check

      - name: Render MP4
        run: npx --yes hyperframes@0.9.72 render -o renders/hyperframes-demo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: hyperframes-demo-video
          path: hyperframes-demo/renders/hyperframes-demo.mp4
