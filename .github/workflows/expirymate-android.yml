name: ExpiryMate Android build

# Builds the ExpiryMate Android app and publishes an installable test .apk.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-expiry-app/**'
      - '.github/workflows/expirymate-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build
        working-directory: android-expiry-app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename .apk
        run: cp android-expiry-app/app/build/outputs/apk/debug/app-debug.apk ExpiryMate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ExpiryMate-android-apk
          path: ExpiryMate.apk
          if-no-files-found: error
